name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate native Android project
        run: flutter create --org com.robabikya --project-name robabikya --platforms=android .

      - name: Copy Firebase config into place
        run: cp google-services.json android/app/google-services.json

      - name: Patch Android project (permissions, name, Firebase plugin)
        run: python3 scripts/patch_android.py

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: robabikya-apk
          path: build/app/outputs/flutter-apk/app-release.apk
